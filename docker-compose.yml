version: '3'
services:
  hive-server:
    image: apache/hive:4.0.0
    container_name: hive
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      - SERVICE_NAME=hiveserver2
      - HIVE_METASTORE_URI=thrift://hive-metastore:9083
    depends_on:
      - hive-metastore
    networks:
      - hive-net

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: metastore
    environment:
      - SERVICE_NAME=metastore
      - DB_DRIVER=mysql
      - DB_URL=jdbc:mysql://mysql:3306/hive?createDatabaseIfNotExist=true
      - DB_USER=root
      - DB_PASS=123456
    depends_on:
      - mysql
    networks:
      - hive-net

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=hive
    networks:
      - hive-net

networks:
  hive-net: